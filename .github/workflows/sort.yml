name: Sort Links

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  CI:
    if: ${{ !contains(github.event.head_commit.message, '[skip linklist deploy]') }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pnpm-version: [12]
        node-version: [26]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Prepare pnpm ${{matrix.pnpm-version}}
        uses: pnpm/action-setup@v4
        with:
          version: ${{matrix.pnpm-version}}
      - name: Prepare Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
      - name: Cache node_modules
        uses: actions/cache@v4
        env:
          cache-name: project-node-modules
        with:
          path: node_modules
          key: ${{runner.os}}-${{env.cache-name}}-${{hashFiles('package.json')}}
      - name: Install dependencies
        run: pnpm install
      - name: Validate links
        run: pnpm validate
      - name: Run sort script
        run: pnpm sort
      - name: Commit and push sorted YAML
        run: |
          git config --local user.email "148861329+inslicc@users.noreply.github.com"
          git config --local user.name "inslicc"
          git add -- src/list.yml
          if git diff --cached --quiet; then
            echo "No sorted YAML changes."
          else
            git commit -m "chore: auto-sort YAML file [skip linklist deploy]"
            git push origin HEAD:main
          fi
      - name: Build linklist JSON
        run: pnpm build
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          apiToken: ${{ secrets.CF_API_TOKEN }}
          command: deploy
          wranglerVersion: '4.150.0'